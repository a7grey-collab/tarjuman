<!doctype html>
<html lang="ru" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#16201D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tarjuman</title>
<style>
/* Layout: one narrow column; WhatsApp-like voice feed is the main screen. Language colors: RU ink-blue, AR palm-green, EN clay */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#16201D; --muted:#5D6A65; --line:#DAE0DA;
  --ru:#2C4890; --ru-soft:#E5EAF6; --ar:#0A7656; --ar-soft:#DDF0E8; --en:#9A4A1E; --en-soft:#F6E8DE;
  --on-accent:#FFFFFF; --danger:#B3261E; --warn-soft:#FFF4D6; --warn:#7A5600; --wave:#9AA7A1;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,"Geeza Pro",sans-serif;
  --f-mark:"Amiri", Georgia, serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E6ECE9; --muted:#93A19B; --line:#27322E;
  --ru:#93ABEE; --ru-soft:#1C2640; --ar:#52D0A4; --ar-soft:#123026; --en:#E9A27A; --en-soft:#3A2418;
  --on-accent:#0E1412; --danger:#F2867E; --warn-soft:#3A2F12; --warn:#F3D27A; --wave:#5C6A64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E6ECE9; --muted:#93A19B; --line:#27322E;
  --ru:#93ABEE; --ru-soft:#1C2640; --ar:#52D0A4; --ar-soft:#123026; --en:#E9A27A; --en-soft:#3A2418;
  --on-accent:#0E1412; --danger:#F2867E; --warn-soft:#3A2F12; --warn:#F3D27A; --wave:#5C6A64; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-ui); margin:0; padding-inline:16px; padding-block:12px 24px}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
section.wrap{width:100%}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{opacity:.5; cursor:default}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ru); outline-offset:2px}
select{font:inherit; padding:7px 8px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}

header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.mark{display:flex; align-items:baseline; gap:8px}
.mark b{font:700 26px/1 var(--f-mark)}
.mark span{font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.chip{font-size:12px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); background:var(--surface); white-space:nowrap}
.chip i{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ar); margin-right:6px; vertical-align:1px}

.tabs{display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px}
.tabs button{border:0; background:transparent; padding:9px 4px; border-radius:9px; font-weight:500; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}

details.set{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 12px}
details.set summary{cursor:pointer; padding:10px 0; font-size:14px; color:var(--muted); list-style:none; display:flex; justify-content:space-between; gap:8px}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:"▾"}
details.set[open] summary::after{content:"▴"}
.setgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; padding-bottom:12px; font-size:13px; color:var(--muted)}
.setgrid label{display:flex; flex-direction:column; gap:4px}
.setgrid label.row{flex-direction:row; align-items:center; gap:8px}

/* language pair */
.pair{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:end}
.pair label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); letter-spacing:.04em; min-width:0}
.pair select{font-weight:600; padding:10px; border-radius:11px}
.swap{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:18px}

/* voice pack banner */
.pack{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:12px; background:var(--warn-soft); color:var(--warn); font-size:13.5px}
.pack.ok{background:var(--ar-soft); color:var(--ar)}
.pack .txt{flex:1; min-width:200px}
.pack button{border:0; border-radius:9px; padding:7px 12px; background:var(--ink); color:var(--bg); font-weight:600; font-size:13px}
.bar{height:5px; border-radius:9px; background:rgba(127,127,127,.25); overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; width:0; background:currentColor; transition:width .2s}

/* feed */
.feed{display:flex; flex-direction:column; gap:12px; min-height:180px}
.card{border-radius:18px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; width:min(100%,520px); min-width:0}
.card.mine{align-self:flex-start; border-bottom-left-radius:5px}
.card.theirs{align-self:flex-end; border-bottom-right-radius:5px}
.card.l-ru{background:var(--ru-soft)} .card.l-ar{background:var(--ar-soft)} .card.l-en{background:var(--en-soft)}
.card .head{display:flex; justify-content:space-between; gap:8px; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums}
.card .src{font-size:14px; color:var(--muted); overflow-wrap:anywhere}
.card .dst{font-size:20px; line-height:1.55; overflow-wrap:anywhere}
.card textarea{width:100%; min-height:70px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px; font:15px/1.5 var(--f-ui)}
.card .st{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.card .st.err{color:var(--danger)}
.card .st.rec{color:var(--danger); font-weight:600}
.card.example{opacity:.85}
.acts{display:flex; gap:6px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 11px; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.btn svg{width:16px; height:16px}
.btn.main{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
.spoken{font-size:15px; color:var(--muted); line-height:1.9; padding:2px 4px}
.orig{display:flex; flex-direction:column; gap:4px}
.orig:empty{display:none}
.orig .lab{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.attach{display:flex; gap:8px; flex-wrap:wrap}
.attach .btn{flex:1; justify-content:center; padding:11px 12px; font-size:14px; font-weight:600; border-style:dashed}
.install{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:13.5px}
.install .txt{flex:1; min-width:200px}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:4px 8px}
.is-ar{font-family:var(--f-ar)!important; direction:rtl; text-align:right}
.dst.is-ar{font-size:22px; line-height:1.75}

/* WhatsApp-like voice note */
.vn{display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:99px; padding:6px 14px 6px 6px; min-width:0}
.vn .play{flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--ink); color:var(--bg); display:grid; place-items:center}
.vn .play svg{width:18px; height:18px}
.vn .wave{flex:1; min-width:0; height:30px; display:flex; align-items:center; gap:2px; cursor:pointer}
.vn .wave i{flex:1; min-width:2px; max-width:4px; border-radius:2px; background:var(--wave)}
.vn .wave i.on{background:var(--ink)}
.vn .dur{flex:none; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

.recbar{display:grid; grid-template-columns:1fr 1fr; gap:10px; position:sticky; bottom:0; padding-block:8px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--bg); z-index:2}
.rec{border:0; border-radius:18px; padding:14px 8px; font-weight:600; font-size:16px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--on-accent); box-shadow:0 6px 18px rgba(0,0,0,.12); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.rec svg{width:28px; height:28px}
.rec.l-ru{background:var(--ru)} .rec.l-ar{background:var(--ar)} .rec.l-en{background:var(--en)}
.rec .lbl.ar-t{font-family:var(--f-ar)}
.rec small{font-weight:400; font-size:12px; opacity:.92}
.rec.on{background:var(--danger); animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(179,38,30,.16)}}
@media (prefers-reduced-motion:reduce){.rec.on,.mic.on{animation:none}}
.hint{font-size:12.5px; color:var(--muted); text-align:center}
.typerow{display:flex; gap:8px}
.typerow input{flex:1; min-width:0; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:16px var(--f-ui)}
.typerow button{border:0; border-radius:12px; padding:0 16px; background:var(--ink); color:var(--bg); font-weight:600}

/* text tab */
.pane{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); display:flex; flex-direction:column; min-width:0}
.pane.out{border-color:transparent}
.pane.out.l-ru{background:var(--ru-soft)} .pane.out.l-ar{background:var(--ar-soft)} .pane.out.l-en{background:var(--en-soft)}
#src{width:100%; min-height:120px; resize:vertical; border:0; background:transparent; color:var(--ink); padding:14px; font:18px/1.5 var(--f-ui); border-radius:var(--r)}
#src.is-ar{font-size:21px; line-height:1.7}
.result{padding:14px; min-height:90px; font-size:19px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere}
.result.is-ar{font-size:22px; line-height:1.75}
.result.muted{color:var(--muted); font-size:15px}
.tools{display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); align-items:center; flex-wrap:wrap}
.pane.out .tools{border-top-color:rgba(127,127,127,.18)}
.tools .sp{flex:1}
.mic{border:0; background:var(--ink); color:var(--bg); border-radius:99px; padding:9px 16px; font-weight:600; display:inline-flex; align-items:center; gap:8px}
.mic svg{width:18px; height:18px}
.mic.on{background:var(--danger); color:var(--on-accent); animation:pulse 1.2s infinite}
.status{font-size:13px; color:var(--muted); min-height:20px}
#textvoice{padding:0 10px 10px; display:flex; flex-direction:column; gap:8px}

/* history */
.hist{display:flex; flex-direction:column; gap:8px}
.hi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; text-align:left; width:100%}
.hi .s{color:var(--muted); font-size:13px; overflow-wrap:anywhere}
.hi .d{font-size:17px; overflow-wrap:anywhere}
.hi .w{font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-variant-numeric:tabular-nums}

.note{font-size:12.5px; color:var(--muted); line-height:1.55}
footer{display:flex; justify-content:center; align-items:center; gap:6px; font-size:13px; color:var(--muted); padding-top:8px; flex-wrap:wrap}
footer a{color:var(--ru); text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-weight:500}
footer svg{width:15px; height:15px}
.toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:14px; max-width:calc(100% - 32px); text-align:center; z-index:10}

.hright{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.uisw{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px; gap:2px}
.uisw button{border:0; background:transparent; border-radius:99px; padding:5px 10px; font-size:13px; font-weight:600; color:var(--muted)}
.uisw button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.uisw button[data-ui="ar"]{font-family:var(--f-ar)}
.tabs.two{grid-template-columns:repeat(2,1fr)}
#src{min-height:150px}
.result{min-height:120px}
.count,.tag{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.tag{border:1px solid var(--line); border-radius:99px; padding:2px 8px; background:var(--surface)}
[dir="rtl"] body{font-family:var(--f-ar), var(--f-ui)}
.micbar{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.micbtn{border:0; border-radius:16px; padding:13px 8px; font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--on-accent); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.micbtn svg{width:22px; height:22px; flex:none}
.micbtn.l-ru{background:var(--ru)} .micbtn.l-ar{background:var(--ar)} .micbtn.l-en{background:var(--en)}
.micbtn .ar-t{font-family:var(--f-ar)}
.micbtn.on{background:var(--danger); animation:pulse 1.2s infinite}
.hint{font-size:12.5px; color:var(--muted); text-align:center}
.result.muted.is-ar{direction:inherit; text-align:start; font-family:var(--f-ui)!important; font-size:15px; line-height:1.5}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@700&display=swap">
</head>
<body translate="no">
<div class="wrap notranslate" translate="no">
  <header>
    <div class="mark"><b>Tarjuman</b><span>RU · AR · EN</span></div>
    <div class="hright">
      <div class="uisw" role="group" aria-label="App language"><button data-ui="ru" aria-pressed="false">Рус</button><button data-ui="en" aria-pressed="false">Eng</button><button data-ui="ar" aria-pressed="false">عربي</button></div>
      <div class="chip" id="engine"><i></i></div>
    </div>
  </header>

  <div class="tabs two" role="tablist">
    <button role="tab" aria-selected="true" data-tab="text" id="t-text" data-i18n="tabText"></button>
    <button role="tab" aria-selected="false" data-tab="hist" id="t-hist" data-i18n="tabHist"></button>
  </div>

  <section id="p-text" class="wrap" style="gap:12px">
    <div class="pair">
      <label><span data-i18n="from"></span>
        <select id="from"><option value="ru">Русский</option><option value="ar">العربية</option><option value="en">English</option></select>
      </label>
      <button class="swap" id="swap" data-i18n-aria="swapLangs">⇄</button>
      <label><span data-i18n="to"></span>
        <select id="to"><option value="ru">Русский</option><option value="ar">العربية</option><option value="en">English</option></select>
      </label>
    </div>
    <div class="pane">
      <textarea id="src" data-i18n-ph="srcPh" dir="auto" rows="5"></textarea>
      <div class="tools">
        <button class="btn" id="paste" data-i18n="paste"></button>
        <button class="btn" id="clear" data-i18n="clear"></button>
        <span class="sp"></span>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div class="micbar">
      <button class="micbtn" id="mic-a" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg><span class="lbl"></span></button>
      <button class="micbtn" id="mic-b" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg><span class="lbl"></span></button>
    </div>
    <div class="pane out l-ar" id="outpane">
      <div class="result muted" id="dst" dir="auto"></div>
      <div class="tools">
        <button class="btn main" id="copy" data-i18n="copy" disabled></button>
        <button class="btn" id="send" data-i18n="send" disabled></button>
        <span class="sp"></span>
        <span class="tag" id="fixedtag" data-i18n="fixedTag" hidden></span>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="hint" data-i18n="micHint"></div>
  </section>

  <section id="p-hist" class="wrap" style="gap:10px" hidden>
    <div class="hist" id="hist"></div>
    <button class="btn" id="hist-clear" style="align-self:center" data-i18n="histClear"></button>
  </section>

  <p class="note" data-i18n="note"></p>

  <footer dir="ltr">Developer Alex Grey

  </footer>
</div>

<script>
/* ================= fixed Islamic greetings & formulas (machine translation often breaks them) ================= */
const FIXED = {
 salam_full:{ar:'السلام عليكم ورحمة الله وبركاته', ru:'Ассаляму алейкум ва рахматуллахи ва баракятух', en:'Assalamu alaikum wa rahmatullahi wa barakatuh'},
 reply_full:{ar:'وعليكم السلام ورحمة الله وبركاته', ru:'Ва алейкум ассалям ва рахматуллахи ва баракятух', en:'Wa alaikum assalam wa rahmatullahi wa barakatuh'},
 salam_rahma:{ar:'السلام عليكم ورحمة الله', ru:'Ассаляму алейкум ва рахматуллах', en:'Assalamu alaikum wa rahmatullah'},
 reply_rahma:{ar:'وعليكم السلام ورحمة الله', ru:'Ва алейкум ассалям ва рахматуллах', en:'Wa alaikum assalam wa rahmatullah'},
 salam:{ar:'السلام عليكم', ru:'Ассаляму алейкум', en:'Assalamu alaikum'},
 reply:{ar:'وعليكم السلام', ru:'Ва алейкум ассалям', en:'Wa alaikum assalam'},
 insha:{ar:'إن شاء الله', ru:'Ин ша Аллах', en:'In sha Allah'},
 masha:{ar:'ما شاء الله', ru:'Ма ша Аллах', en:'Masha Allah'},
 hamd:{ar:'الحمد لله', ru:'Альхамдулиллях', en:'Alhamdulillah'},
 bism_full:{ar:'بسم الله الرحمن الرحيم', ru:'Бисмилляхи-р-рахмани-р-рахим', en:'Bismillahir rahmanir rahim'},
 bism:{ar:'بسم الله', ru:'Бисмиллях', en:'Bismillah'},
 jazak:{ar:'جزاك الله خيرا', ru:'Джазакаллаху хайран', en:'Jazakallahu khairan'},
 barak:{ar:'بارك الله فيك', ru:'Баракаллаху фик', en:'Barakallahu feek'},
 subhan:{ar:'سبحان الله', ru:'Субханаллах', en:'Subhanallah'},
 akbar:{ar:'الله أكبر', ru:'Аллаху акбар', en:'Allahu akbar'},
 astagh:{ar:'أستغفر الله', ru:'Астагфируллах', en:'Astaghfirullah'},
 jumua:{ar:'جمعة مباركة', ru:'Джума мубарак', en:'Jumu‘ah Mubarak'},
 eid:{ar:'عيد مبارك', ru:'Ид мубарак', en:'Eid Mubarak'},
 ramadan:{ar:'رمضان كريم', ru:'Рамадан карим', en:'Ramadan Kareem'},
 aman:{ar:'في أمان الله', ru:'Фи аманиллях', en:'Fi amanillah'}
};
function normFix(s,lang){
  s=s.toLowerCase().replace(/ё/g,'е').replace(/[’'`ʿʼ‘]/g,'');
  if(lang==='ar'){ s=s.replace(/[ً-ْٰـ]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه'); }
  return s.replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
}
const FIX_AR = (()=>{ const m={}; const add=(k,...v)=>v.forEach(x=>m[normFix(x,'ar')]=k);

const HK='tarjuman.history.v1';
function getHist(){ try{ return JSON.parse(localStorage.getItem(HK)||'[]'); }catch(e){ return []; } }
function addHist(from,to,src,dst){ const h=getHist(); if(h[0]&&h[0].src===src&&h[0].dst===dst) return; h.unshift({from,to,src,dst,t:Date.now()}); try{ localStorage.setItem(HK,JSON.stringify(h.slice(0,200))); }catch(e){} }
function renderHist(){
  const box=$('#hist'); box.innerHTML=''; const h=getHist();
  if(!h.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=t('histEmpty'); box.appendChild(e); return; }
  const loc=UI==='ar'?'ar-SA-u-nu-latn':UI==='en'?'en-GB':'ru-RU';
  h.forEach(it=>{
    const b=document.createElement('button'); b.className='hi'; const d=new Date(it.t);
    b.innerHTML='<span class="w" dir="ltr"></span><span class="s" dir="auto"></span><span class="d" dir="auto"></span>';
    b.querySelector('.w').textContent=((L[it.from]||L.ru).short)+' → '+((L[it.to]||L.ar).short)+' · '+d.toLocaleDateString(loc)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    const s=b.querySelector('.s'), dd=b.querySelector('.d'); s.textContent=it.src; dd.textContent=it.dst;
    if(it.from==='ar') s.classList.add('is-ar'); if(it.to==='ar') dd.classList.add('is-ar');
    b.onclick=()=>{ if(!L[it.from]||!L[it.to]) return; setDir(it.from,it.to); src.value=it.src; showResult(it.dst,false); updateCount(); $('#t-text').click(); };
    box.appendChild(b);
  });
}
$('#hist-clear').onclick=()=>{ try{ localStorage.removeItem(HK); }catch(e){} renderHist(); toast(t('histCleared')); };

/* ================= tabs ================= */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['text','hist'].forEach(n=>$('#p-'+n).hidden=n!==b.dataset.tab);
  if(b.dataset.tab==='hist') renderHist();
});

/* ================= translator ================= */
const src=$('#src'), dst=$('#dst');
function applyDir(){
  $('#from').value=state.from; $('#to').value=state.to;
  src.classList.toggle('is-ar',state.from==='ar'); dst.classList.toggle('is-ar',state.to==='ar');
  $('#outpane').className='pane out l-'+state.to;
  if(dst.classList.contains('muted')) dst.textContent=t('resultPh');
  if(typeof applyMics==='function' && document.querySelector('#mic-a')) try{ applyMics(); }catch(e){}
}
function setDir(from,to){ if(from===to) to=from===state.me?state.them:(LANGS.find(l=>l!==from)); state.from=from; state.to=to; savePrefs(); applyDir(); }
$('#from').onchange=e=>{ const f=e.target.value; setDir(f, state.to===f?state.from:state.to); runText(true); };
$('#to').onchange=e=>{ const x=e.target.value; setDir(state.from===x?state.to:state.from, x); runText(true); };
$('#swap').onclick=()=>{ const out=!dst.classList.contains('muted')&&dst.textContent; setDir(state.to,state.from); if(out){ src.value=out; updateCount(); } runText(true); };
function showResult(text,fixed){
  dst.classList.remove('muted'); dst.textContent=text; $('#fixedtag').hidden=!fixed;
  $('#copy').disabled=false; $('#send').disabled=false;
}
function clearResult(){ dst.textContent=t('resultPh'); dst.classList.add('muted'); $('#fixedtag').hidden=true; $('#copy').disabled=true; $('#send').disabled=true; }
function updateCount(){ const n=src.value.length; $('#count').textContent=n?t('chars',{n}):''; }
let ctrl=null, debT=null, histT=null, gen=0;
async function runText(now){
  clearTimeout(debT);
  if(!now){ debT=setTimeout(()=>runText(true),450); return; }
  const text=src.value.trim(); if(ctrl) ctrl.abort(); ctrl=new AbortController(); const g=++gen; clearTimeout(histT);
  if(!text){ clearResult(); $('#status').textContent=''; return; }
  $('#status').textContent=t('translating');
  try{
    const {out,fixed}=await translate(text,state.from,state.to,ctrl.signal); if(g!==gen) return;
    showResult(out,fixed); $('#status').textContent='';
    const f=state.from,x=state.to; histT=setTimeout(()=>addHist(f,x,text,out),1800);
  }catch(e){ if(e&&(e.code==='cancelled'||e.name==='AbortError')) return; if(g===gen) $('#status').textContent=e.message||t('trFail'); }
}
src.addEventListener('input',()=>{
  updateCount();
  const d=detect(src.value);
  if(d && d!==state.from){ if(d===state.to) setDir(d,state.from); else setDir(d, d===state.me?state.them:state.me); }
  runText(false);
});
src.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); runText(true); } });
$('#clear').onclick=()=>{ src.value=''; updateCount(); runText(true); src.focus(); };
$('#paste').onclick=async()=>{ try{ const x=await navigator.clipboard.readText(); if(x){ src.value=x; src.dispatchEvent(new Event('input')); runText(true); } }catch(e){ toast(t('pasteFail')); src.focus(); } };
$('#copy').onclick=()=>{ if(!dst.classList.contains('muted')) copyText(dst.textContent); };
$('#send').onclick=async()=>{ if(dst.classList.contains('muted')) return; const x=dst.textContent; try{ if(navigator.share){ await navigator.share({text:x}); return; } }catch(e){ if(e.name==='AbortError') return; } copyText(x); };


/* ================= dictation: speak, get text, translate text (no voice output) ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IN_CLAUDE = !!(window.claude && window.claude.use);
function srError(c){
  if(c==='not-allowed'||c==='service-not-allowed') return IN_CLAUDE ? t('micDeniedClaude') : t('micDenied');
  if(c==='no-speech') return t('noSpeech'); if(c==='network') return t('srNet'); if(c==='audio-capture') return t('noMic');
  if(c==='language-not-supported') return t('srLang'); return t('srErr',{e:c});
}
function createListener(lang,h){
  if(!SR){ toast(t('noSR')); return null; }
  let finalText='', stopped=false, r=null, restarts=0, fatal=null, netErrs=0, lastNet=false;
  const join=(a,b)=>a&&b?a+' '+b:(a||b||'');
  function start(){
    r=new SR(); r.lang=L[lang].sr; r.interimResults=true; r.continuous=!IS_ANDROID; r.maxAlternatives=1;
    let segFinal='';
    r.onresult=e=>{ let interim=''; segFinal=''; for(let i=0;i<e.results.length;i++){ const x=e.results[i][0].transcript; if(e.results[i].isFinal) segFinal+=(segFinal?' ':'')+x.trim(); else interim+=x; } h.interim&&h.interim(join(finalText,join(segFinal,interim.trim()))); };
    r.onerror=e=>{ if(e.error==='network'&&netErrs<3){ netErrs++; lastNet=true; return; } if(['not-allowed','service-not-allowed','audio-capture','language-not-supported','network'].includes(e.error)){ fatal=e.error; toast(srError(e.error)); } };
    r.onend=()=>{ finalText=join(finalText,segFinal);
      if(!stopped&&!fatal&&restarts<30){ restarts++; const w=lastNet?400:0; lastNet=false; setTimeout(()=>{ if(stopped){ h.end(finalText.trim(),fatal); return; } try{ start(); }catch(e){ h.end(finalText.trim(),fatal); } },w); return; }
      h.end(finalText.trim(),fatal); };
    r.start();
  }
  try{ start(); }catch(e){ toast(t('micFail')); return null; }
  return { stop(){ stopped=true; try{ r.stop(); }catch(e){} } };
}
function pairOrder(){ const a=state.from, b=state.to; return (b===state.me) ? [b,a] : [a,b]; }
function applyMics(){
  const [a,b]=pairOrder();
  [['#mic-a',a],['#mic-b',b]].forEach(([id,lang])=>{
    const el=$(id), on=!!(rec&&rec.btn===el); el.dataset.lang=lang; el.className='micbtn l-'+lang+(on?' on':'');
    const lbl=el.querySelector('.lbl'); lbl.textContent=on?t('recTap'):L[lang].speak; lbl.classList.toggle('ar-t',lang==='ar'&&!on);
  });
}
let rec=null;
function startRec(btn){
  const lang=btn.dataset.lang, other=lang===state.from?state.to:state.from;
  setDir(lang,other);
  const base=''; src.value=''; updateCount(); clearResult();
  const t0=Date.now(); const st=$('#status');
  const tick=setInterval(()=>{ st.textContent=t('recording',{t:Math.floor((Date.now()-t0)/1000)+'s'}); },300);
  st.textContent=t('recording',{t:'0s'});
  const session={btn};
  const lis=createListener(lang,{
    interim:x=>{ src.value=base+x; updateCount(); },
    end:(x)=>{ clearInterval(tick); if(rec===session){ rec=null; applyMics(); } st.textContent=''; if(x){ src.value=base+x; updateCount(); runText(true); } }
  });
  if(!lis){ clearInterval(tick); st.textContent=''; return; }
  session.lis=lis; rec=session; applyMics();
  if(navigator.vibrate) try{ navigator.vibrate(25); }catch(e){}
}
function stopRec(){ if(rec) rec.lis.stop(); }
['#mic-a','#mic-b'].forEach(id=>{
  const b=$(id); let downAt=0, startedHere=false;
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); downAt=Date.now(); startedHere=false; if(rec){ const same=rec.btn===b; stopRec(); if(same) return; } startRec(b); startedHere=true; try{ b.setPointerCapture(e.pointerId); }catch(_){} });
  const up=()=>{ if(!startedHere) return; startedHere=false; if(Date.now()-downAt>450) stopRec(); };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(rec&&rec.btn===b) stopRec(); else { if(rec) stopRec(); startRec(b); } } });
});

/* ================= interface language = the user's main language ================= */
function setUI(lang,fromUser){
  if(!UI_LANGS.includes(lang)) return;
  UI=lang; state.ui=lang;
  if(fromUser){ const prev=state.me; state.me=lang; if(state.them===lang) state.them=prev!==lang?prev:(lang==='ar'?'ru':'ar'); state.from=state.me; state.to=state.them; }
  savePrefs(); applyI18n(); setEngine(); applyDir(); updateCount();
  if(!$('#p-hist').hidden) renderHist();
  if(fromUser && src.value.trim()){ const d=detect(src.value); if(d) setDir(d, d===state.me?state.them:state.me); runText(true); }
}
document.querySelectorAll('.uisw button').forEach(b=>b.onclick=()=>setUI(b.dataset.ui,true));

/* ================= text shared from WhatsApp (Share → Tarjuman) ================= */
function pickUpSharedText(){
  const q=new URLSearchParams(location.search);
  const x=[q.get('title'),q.get('text'),q.get('t')].filter(Boolean).join('\n').trim();
  if(q.has('shared')||q.has('text')||q.has('title')) history.replaceState(null,'',location.pathname);
  if(!x) return;
  src.value=x; updateCount();
  const d=detect(x); if(d) setDir(d, d===state.me?state.them:state.me);
  runText(true);
}
if(!(window.claude&&window.claude.use) && (location.protocol==='https:'||location.hostname==='localhost') && 'serviceWorker' in navigator){
  if(!document.querySelector('link[rel=manifest]')){ const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l); }
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{});
}

/* ================= start ================= */
applyI18n(); setEngine(); applyDir(); clearResult(); updateCount();
pickUpSharedText();
if(!src.value) src.focus({preventScroll:true});

</script>
