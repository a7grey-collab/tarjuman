<style>
/* Layout: one phone screen, no page scroll — header / language bar / source / translation / mic buttons. RU ink-blue, AR palm-green, EN clay */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#16201D; --muted:#5D6A65; --line:#DAE0DA;
  --ru:#2C4890; --ru-soft:#E5EAF6; --ar:#0A7656; --ar-soft:#DDF0E8; --en:#9A4A1E; --en-soft:#F6E8DE;
  --on-accent:#FFFFFF; --danger:#B3261E; --notice:#FFF4D6; --notice-ink:#5A4300;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,"Geeza Pro",sans-serif;
  --f-mark:"Amiri", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --ru:#3D5BA8; --ru-soft:#1C2640; --ar:#0F8A66; --ar-soft:#123026; --en:#A8592C; --en-soft:#3A2418;
  --on-accent:#FFFFFF; --danger:#C2453D; --notice:#3A2F12; --notice-ink:#F3D27A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2A3531;
  --ru:#3D5BA8; --ru-soft:#1C2640; --ar:#0F8A66; --ar-soft:#123026; --en:#A8592C; --en-soft:#3A2418;
  --on-accent:#FFFFFF; --danger:#C2453D; --notice:#3A2F12; --notice-ink:#F3D27A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 var(--f-ui); overflow:hidden; padding-inline:12px}
[dir="rtl"] body{font-family:var(--f-ar),var(--f-ui)}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{opacity:.4; cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ru); outline-offset:2px}
.app{max-width:640px; margin:0 auto; height:100%; height:100svh; display:grid; grid-template-rows:auto auto auto minmax(64px,1fr) minmax(64px,1fr) auto auto auto; grid-template-areas:'top' 'notice' 'lang' 'src' 'dst' 'status' 'mics' 'sign'; gap:8px; padding-block:8px calc(6px + env(safe-area-inset-bottom,0px)); min-height:0}
.top{display:flex; align-items:center; gap:8px; min-width:0}
.logo{font:700 20px/1 var(--f-mark); flex:1 1 auto; min-width:0; white-space:nowrap}
.uisw{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:2px; gap:1px; flex:none}
.uisw button{border:0; background:transparent; border-radius:99px; padding:4px 7px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap}
.uisw button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.uisw button[data-ui="ar"]{font-family:var(--f-ar)}
.icon{flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0}
.icon svg{width:20px; height:20px}
.notice{background:var(--notice); color:var(--notice-ink); border-radius:12px; padding:8px 10px; font-size:13.5px}
.notice .ntop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.notice .ntop b{flex:1; min-width:140px}
.notice ul{margin:6px 0 0; padding-inline-start:18px; display:grid; gap:2px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 12px; font-size:13.5px; display:inline-flex; align-items:center; gap:6px}
.btn.main{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
.btn svg{width:18px; height:18px; flex:none}
.langbar{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center}
.langbar select{width:100%; min-width:0; font:600 15px var(--f-ui); padding:9px 8px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.card{display:flex; flex-direction:column; min-height:0; border-radius:16px; overflow:hidden}
.card.in{background:var(--surface); border:1px solid var(--line)}
.card.out.l-ru{background:var(--ru-soft)} .card.out.l-ar{background:var(--ar-soft)} .card.out.l-en{background:var(--en-soft)}
#src{flex:1; min-height:0; width:100%; resize:none; border:0; background:transparent; color:var(--ink); padding:12px 14px 4px; font:18px/1.45 var(--f-ui)}
#src::placeholder{color:var(--muted)}
#src.is-ar{font-family:var(--f-ar); font-size:20px}
.result{flex:1; min-height:0; overflow:auto; padding:12px 14px 4px; font-size:19px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}
.result.is-ar{font-family:var(--f-ar); font-size:21px; line-height:1.7}
.result.muted{color:var(--muted); font-size:16px}
.result.muted.is-ar{direction:inherit; text-align:start; font-family:var(--f-ui)}
.tools{display:flex; align-items:center; gap:6px; padding:6px 8px 8px; flex-wrap:nowrap; min-width:0}
.tools .icon{width:36px; height:36px; background:transparent}
.card.out .tools .icon{border-color:rgba(127,127,127,.25)}
.pill{flex:none; border:0; border-radius:99px; padding:7px 12px; background:var(--ink); color:var(--bg); font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; max-width:46%; overflow:hidden}
.pill span{overflow:hidden; text-overflow:ellipsis}
.pill svg{width:16px; height:16px; flex:none}
.pill.busy{animation:pulse 1.2s infinite}
.sp{flex:1; min-width:0}
.tag{font-size:11.5px; color:var(--muted); border:1px solid rgba(127,127,127,.3); border-radius:99px; padding:2px 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.status{font-size:12.5px; color:var(--muted); min-height:1.2em; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status:empty{min-height:0; margin-top:-8px}
.micbar{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.micbtn{border:0; border-radius:16px; padding:12px 8px; min-height:52px; font-weight:600; font-size:15px; line-height:1.2; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--on-accent); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; min-width:0}
.micbtn svg{width:22px; height:22px; flex:none}
.micbtn .lbl{min-width:0; overflow:hidden; text-overflow:ellipsis}
.micbtn.l-ru{background:var(--ru)} .micbtn.l-ar{background:var(--ar)} .micbtn.l-en{background:var(--en)}
.micbtn .ar-t{font-family:var(--f-ar)}
.micbtn.on{background:var(--danger); animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(179,38,30,.18)}}
@media (prefers-reduced-motion:reduce){.micbtn.on,.pill.busy{animation:none}}
.sign{font-size:11px; color:var(--muted); text-align:center; display:flex; justify-content:center; align-items:center; gap:4px; white-space:nowrap}
.sign a,.sheet footer a{color:var(--ru); text-decoration:none; display:inline-flex; align-items:center; gap:3px; font-weight:500}
[data-theme="dark"] .sign a{color:#93ABEE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sign a{color:#93ABEE}}
.sign svg,.sheet footer svg{width:13px; height:13px}
.sheet{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:flex; justify-content:center; align-items:flex-end}
.sheet-in{background:var(--bg); width:100%; max-width:640px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px}
.sheet-head{display:flex; align-items:center; justify-content:space-between; font-size:17px}
.sheet h3{margin:6px 0 0; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.sheet label{display:flex; flex-direction:column; gap:4px; font-size:13.5px; color:var(--muted)}
.sheet label.row{flex-direction:row; align-items:center; gap:8px; color:var(--ink)}
.sheet select{font:inherit; padding:8px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:100%}
.sheet .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.btn.wide{justify-content:center; padding:11px; font-weight:600}
.hist{display:flex; flex-direction:column; gap:6px}
.hi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; text-align:start; width:100%}
.hi .w{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.hi .s{font-size:13px; color:var(--muted); overflow-wrap:anywhere} .hi .d{font-size:15px; overflow-wrap:anywhere}
.empty{color:var(--muted); font-size:14px}
.sheet footer{font-size:12px; color:var(--muted); text-align:center; display:flex; justify-content:center; align-items:center; gap:4px; padding-top:6px}
.toast{position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:14px; font-size:14px; width:max-content; max-width:calc(100% - 32px); text-align:center; z-index:30}

@media (max-width:380px){ .top{gap:6px} .icon{width:34px; height:34px} }
.btn.inst{flex-direction:column; gap:4px; text-align:center; white-space:normal; line-height:1.25}
.btn.inst svg{width:22px; height:22px}
.inststeps{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:8px}
.inststeps p{margin:0; white-space:pre-line; font-size:14px; line-height:1.5}
.instlink{display:grid; gap:6px; justify-items:start}
.instlink code{font-size:12.5px; overflow-wrap:anywhere; width:100%; background:var(--bg); border-radius:8px; padding:6px 8px}

.notice.modal{position:fixed; z-index:25; left:50%; top:50%; transform:translate(-50%,-50%); width:min(92vw,420px); max-height:80%; overflow:auto; padding:14px 16px; box-shadow:0 12px 40px rgba(0,0,0,.35)}
.notice.modal .ntop{flex-direction:column; align-items:stretch}
.notice.modal .ntop b{font-size:16px}
.notice.modal #notice-ok{order:3; justify-content:center}
.notice.modal ul{margin:8px 0 10px}
.nback{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:24}

.top{grid-area:top} .notice{grid-area:notice} .langbar{grid-area:lang} .card.in{grid-area:src} .card.out{grid-area:dst} .status{grid-area:status} .micbar{grid-area:mics} .sign{grid-area:sign}
.app > .notice[hidden]{display:block!important; visibility:hidden; height:0; padding:0; margin-top:-8px; overflow:hidden}
.notice.modal #notice-ok{width:100%; justify-content:center; padding:9px}

</style>

<script>
/* ================= interface languages ================= */

  return s.replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
}

function planFixed(text,from){
  const out=[]; let any=false;
  const sents=text.split(/([.!?؟…\n]+\s*)/);
  for(let si=0; si<sents.length; si+=2){
    const sent=sents[si]||'', delim=sents[si+1]||'';
    if(!sent.trim()){ out.push({sep:sent+delim}); continue; }
    const pieces=sent.split(/(\s*[,،;؛]\s*)/); const cl=[], sp=[];
    pieces.forEach((p,i)=> i%2 ? sp.push(p) : cl.push(p));
    let i=0;
    while(i<cl.length){
      let hit=null, j;
      for(j=cl.length-1;j>=i;j--){ const k=fixedKey(cl.slice(i,j+1).join(', '),from); if(k){ hit=k; break; } }
      if(i>0) out.push({sep:sp[i-1]});
      if(hit){ out.push({fixed:hit}); any=true; i=j+1; continue; }
      out.push({text:cl[i]}); i++;
    }
    out.push({sep:delim});
  }
  if(!any) return null;
  const merged=[];
  for(const p of out){
    const last=merged[merged.length-1];
    if(p.text!=null){ if(last&&last.text!=null) last.text+=p.text; else merged.push({text:p.text}); continue; }
    if(p.sep!=null){ if(last&&last.text!=null&&!/[.!?؟…\n]/.test(p.sep)) last.text+=p.sep; else merged.push({sep:p.sep}); continue; }
    merged.push(p);
  }
  const fin=[];
  for(const p of merged){ if(p.text!=null){ const m=p.text.match(/^([\s\S]*?)(\s*[,،;؛]?\s*)$/); if(m[1]) fin.push({text:m[1]}); if(m[2]) fin.push({sep:m[2]}); } else fin.push(p); }

}

$('#from').onchange=e=>{ const f=e.target.value; setDir(f,state.to===f?state.from:state.to); runText(true); };
$('#to').onchange=e=>{ const x=e.target.value; setDir(state.from===x?state.to:state.from,x); runText(true); };
$('#swap').onclick=()=>{ const out=!dst.classList.contains('muted')&&dst.textContent; setDir(state.to,state.from); if(out) src.value=out; runText(true); };
let lastResult={text:'',lang:'ar'};
function setResultButtons(on){ ['#speak','#copy','#share','#vmsg'].forEach(id=>$(id).disabled=!on); }
function showResult(text,fixed){ dst.classList.remove('muted'); dst.textContent=text; $('#fixedtag').hidden=!fixed; lastResult={text,lang:state.to}; setResultButtons(true); }
function clearResult(){ dst.textContent=t('resultPh'); dst.classList.add('muted'); $('#fixedtag').hidden=true; lastResult={text:'',lang:state.to}; setResultButtons(false); }
let ctrl=null, debT=null, histT=null, gen=0;
async function runText(now,speakAfter){
  clearTimeout(debT);
  if(!now){ debT=setTimeout(()=>runText(true),450); return; }
  const text=src.value.trim(); if(ctrl) ctrl.abort(); ctrl=new AbortController(); const g=++gen; clearTimeout(histT);
  stopAllSound();
  if(!text){ clearResult(); return; }
  dst.classList.add('muted'); dst.textContent=t('translating'); setResultButtons(false);
  try{
    const {out,fixed}=await translate(text,state.from,state.to,ctrl.signal); if(g!==gen) return;
    showResult(out,fixed);
    const f=state.from,x=state.to; histT=setTimeout(()=>addHist(f,x,text,out),1500);
    if(speakAfter&&state.autoSpeak) speakText(out,x);
  }catch(e){ if(e&&(e.code==='cancelled'||e.name==='AbortError')) return; if(g===gen){ dst.classList.add('muted'); dst.textContent=e.message||t('trFail'); } }
}
src.addEventListener('input',()=>{ const d=detect(src.value); if(d&&d!==state.from){ if(d===state.to) setDir(d,state.from); else setDir(d,d===state.me?state.them:state.me); } runText(false); });
src.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); runText(true); } });
$('#clear').onclick=()=>{ src.value=''; runText(true); src.focus(); };
$('#paste').onclick=async()=>{ try{ const x=await navigator.clipboard.readText(); if(x){ src.value=x; src.dispatchEvent(new Event('input')); runText(true); } }catch(e){ toast(t('pasteFail')); src.focus(); } };
$('#copy').onclick=()=>{ if(lastResult.text) copyText(lastResult.text); };
$('#share').onclick=async()=>{ const x=lastResult.text; if(!x) return; try{ if(navigator.share){ await navigator.share({text:x}); return; } }catch(e){ if(e.name==='AbortError') return; } copyText(x); };

/* ================= speaking the translation (phone voice; own voice if the phone has none) ================= */
let currentAudio=null;
function stopAllSound(){ try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio=null; } }
function deviceVoice(lang){ if(!window.speechSynthesis) return null; const vs=speechSynthesis.getVoices()||[]; const want=L[lang].sr.toLowerCase(); return vs.find(v=>v.lang.replace('_','-').toLowerCase()===want)||vs.find(v=>v.lang.toLowerCase().startsWith(lang))||null; }
if(window.speechSynthesis) try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}
async function speakText(text,lang){
  if(!text) return; stopAllSound();
  const v=deviceVoice(lang);
  if(v){ const u=new SpeechSynthesisUtterance(text); u.lang=L[lang].sr; try{ u.voice=v; }catch(e){} u.rate=1/parseFloat(state.speed||'1'); speechSynthesis.speak(u); return; }
  if(IN_CLAUDE) return;
  toast(t('noVoice'),2000);
  try{ const r=await Engine.synth(text,lang,m=>setStatus(m)); setStatus(''); const a=new Audio(r.url); currentAudio=a; a.play().catch(()=>{}); }
  catch(e){ setStatus(''); toast(e.message||'error'); }
}
$('#speak').onclick=()=>speakText(lastResult.text,lastResult.lang);

/* ================= voice message file for WhatsApp (voices load only when used) ================= */
function fileFor(v,ext){ const type=v.kind==='opus'?'audio/ogg':v.kind==='mp3'?'audio/mpeg':'audio/wav'; return new File([v.blob],'Tarjuman_'+L[v.lang].short+'_'+stamp()+'.'+ext,{type}); }
function downloadVoice(v){ const f=fileFor(v,v.kind==='opus'?'ogg':v.kind); const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); }
let vmBusy=false;
$('#vmsg').onclick=async()=>{
  if(vmBusy||!lastResult.text) return; vmBusy=true; $('#vmsg').classList.add('busy');
  const {text,lang}=lastResult;
  try{
    const v=await Engine.synth(text,lang,m=>setStatus(m)); setStatus('');
    const exts=v.kind==='opus'?['opus','ogg']:[v.kind]; let shared=false;
    try{ if(navigator.canShare){ for(const ext of exts){ const f=fileFor(v,ext); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); shared=true; break; } } } }catch(e){ if(e.name==='AbortError') shared=true; }
    if(!shared){ downloadVoice(v); toast(t('savedFile')); } else toast(t('vmReady'));
  }catch(e){ setStatus(''); toast(e.message||'error',4000); }
  vmBusy=false; $('#vmsg').classList.remove('busy');
};

/* ================= dictation: speak → text → translation ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_ANDROID=/Android/i.test(navigator.userAgent);
function srError(c){ if(c==='not-allowed'||c==='service-not-allowed') return IN_CLAUDE?t('micDeniedClaude'):t('micDenied'); if(c==='no-speech') return t('noSpeech'); if(c==='network') return t('srNet'); if(c==='audio-capture') return t('noMic'); if(c==='language-not-supported') return t('srLang'); return t('srErr',{e:c}); }
function createListener(lang,h){
  if(!SR){ toast(t('noSR')); return null; }
  let finalText='', stopped=false, r=null, restarts=0, fatal=null, netErrs=0, lastNet=false;
  const join=(a,b)=>a&&b?a+' '+b:(a||b||'');
  function start(){
    r=new SR(); r.lang=L[lang].sr; r.interimResults=true; r.continuous=!IS_ANDROID; r.maxAlternatives=1; let seg='';
    r.onresult=e=>{ let interim=''; seg=''; for(let i=0;i<e.results.length;i++){ const x=e.results[i][0].transcript; if(e.results[i].isFinal) seg+=(seg?' ':'')+x.trim(); else interim+=x; } h.interim&&h.interim(join(finalText,join(seg,interim.trim()))); };
    r.onerror=e=>{ if(e.error==='network'&&netErrs<3){ netErrs++; lastNet=true; return; } if(['not-allowed','service-not-allowed','audio-capture','language-not-supported','network'].includes(e.error)){ fatal=e.error; toast(srError(e.error),4000); } };
    r.onend=()=>{ finalText=join(finalText,seg); if(!stopped&&!fatal&&restarts<30){ restarts++; const w=lastNet?400:0; lastNet=false; setTimeout(()=>{ if(stopped){ h.end(finalText.trim()); return; } try{ start(); }catch(e){ h.end(finalText.trim()); } },w); return; } h.end(finalText.trim()); };
    r.start();
  }
  try{ start(); }catch(e){ toast(t('micFail')); return null; }
  return { stop(){ stopped=true; try{ r.stop(); }catch(e){} } };
}
function pairOrder(){ const a=state.from,b=state.to; return b===state.me?[b,a]:[a,b]; }
let rec=null;
function applyMics(){
  if(!$('#mic-a')) return; const [a,b]=pairOrder();
  [['#mic-a',a],['#mic-b',b]].forEach(([id,lang])=>{ const el=$(id), on=!!(rec&&rec.btn===el); el.dataset.lang=lang; el.className='micbtn l-'+lang+(on?' on':''); const lbl=el.querySelector('.lbl'); lbl.textContent=on?t('recTap'):L[lang].speak; lbl.classList.toggle('ar-t',lang==='ar'&&!on); });
}
function startRec(btn){
  const lang=btn.dataset.lang, other=lang===state.from?state.to:state.from;
  setDir(lang,other); stopAllSound(); src.value=''; clearResult();
  const t0=Date.now(); const tick=setInterval(()=>setStatus(t('listening',{t:mmss((Date.now()-t0)/1000)})),300); setStatus(t('listening',{t:'0:00'}));
  const session={btn};
  const lis=createListener(lang,{ interim:x=>{ src.value=x; }, end:x=>{ clearInterval(tick); setStatus(''); if(rec===session){ rec=null; applyMics(); } if(x){ src.value=x; runText(true,true); } } });
  if(!lis){ clearInterval(tick); setStatus(''); return; }
  session.lis=lis; rec=session; applyMics(); if(navigator.vibrate) try{ navigator.vibrate(25); }catch(e){}
}
function stopRec(){ if(rec) rec.lis.stop(); }
['#mic-a','#mic-b'].forEach(id=>{
  const b=$(id); let downAt=0, startedHere=false;
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); downAt=Date.now(); startedHere=false; if(rec){ const same=rec.btn===b; stopRec(); if(same) return; } startRec(b); startedHere=true; try{ b.setPointerCapture(e.pointerId); }catch(_){} });
  const up=()=>{ if(!startedHere) return; startedHere=false; if(Date.now()-downAt>450) stopRec(); };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(rec&&rec.btn===b) stopRec(); else { if(rec) stopRec(); startRec(b); } } });
});

/* ================= voice message from a file → text → translation ================= */
async function translateVoiceFile(blob){
  if(IN_CLAUDE){ toast(t('micDeniedClaude')); return; }
  closeSheet(); setStatus(t('opening'));
  let audio; try{ audio=await decodeAudio(blob); }catch(e){ setStatus(''); toast(e.message,4000); return; }
  if(audio.seconds<0.3){ setStatus(''); toast(t('asrShort')); return; }
  const t0=Date.now(); let tick=null;
  try{
    const text=await ASR.transcribe(audio.pcm.slice(0), state.them, (phase,frac)=>{
      if(phase==='load') setStatus(t('asrLoad',{pct:Math.round((frac||0)*100)}));
      else if(phase==='work'){ clearInterval(tick); tick=setInterval(()=>setStatus(t('asrWork',{t:mmss((Date.now()-t0)/1000)})),400); }
    });
    clearInterval(tick); setStatus('');
    const clean=(text||'').replace(/\[(?:music|музыка|silence|BLANK_AUDIO)[^\]]*\]/gi,'').trim();
    if(!clean){ toast(t('asrNone')); return; }
    const d=detect(clean)||state.them; setDir(d,d===state.me?state.them:state.me); src.value=clean; runText(true);
  }catch(e){ clearInterval(tick); setStatus(''); toast(/locate file|fetch|network|404|403/i.test(e.message||'')?t('asrNet'):t('asrErr',{e:e.message||'error'}),5000); }
}
$('#file-btn').onclick=()=>$('#file-in').click();
$('#file-in').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) translateVoiceFile(f); };

/* ================= menu sheet ================= */
function openSheet(){ renderHist(); $('#sheet').hidden=false; $('#menu-btn').setAttribute('aria-expanded','true'); }
function closeSheet(){ $('#sheet').hidden=true; $('#menu-btn').setAttribute('aria-expanded','false'); }
$('#menu-btn').onclick=()=>$('#sheet').hidden?openSheet():closeSheet();
$('#sheet-close').onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
const bindSel=(id,key)=>{ const el=$('#'+id); el.value=state[key]; el.onchange=()=>{ state[key]=el.value; savePrefs(); }; };
['speed','ruvoice','envoice','fmt','asr'].forEach(k=>bindSel(k,k));
{ const c=$('#autoSpeak'); c.checked=!!state.autoSpeak; c.onchange=()=>{ state.autoSpeak=c.checked; savePrefs(); }; }

/* ================= install buttons (Android / iOS) ================= */
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let installEvt=null, instShown='';
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });
window.addEventListener('appinstalled',()=>{ installEvt=null; showSteps('done'); });
function showSteps(kind){ instShown=kind; const box=$('#inst-steps'); box.hidden=false; $('#inst-text').textContent= kind==='done'?t('instDone'): kind==='ios'?t('instIOSSteps'):t('instAndroidSteps'); box.querySelector('.instlink').hidden=kind==='done'; }
$('#inst-android').onclick=async()=>{
  if(STANDALONE){ showSteps('done'); return; }
  if(installEvt){ try{ installEvt.prompt(); const r=await installEvt.userChoice; installEvt=null; if(r&&r.outcome==='accepted'){ showSteps('done'); return; } }catch(e){} }
  showSteps('android');
};
$('#inst-ios').onclick=()=>{ showSteps(STANDALONE&&/iPhone|iPad/.test(navigator.userAgent)?'done':'ios'); };
$('#copy-link').onclick=()=>copyText('https://a7grey-collab.github.io/tarjuman/');

/* ================= interface language = main language ================= */
function setUI(lang,fromUser){
  if(!UI_LANGS.includes(lang)) return; UI=lang; state.ui=lang;
  if(fromUser){ const prev=state.me; state.me=lang; if(state.them===lang) state.them=prev!==lang?prev:(lang==='ar'?'ru':'ar'); state.from=state.me; state.to=state.them; }
  savePrefs(); applyI18n(); applyDir(); if(!$('#sheet').hidden) renderHist(); renderNotice(); if(instShown) showSteps(instShown);
  if(fromUser&&src.value.trim()){ const d=detect(src.value); if(d) setDir(d,d===state.me?state.them:state.me); runText(true); }
}
document.querySelectorAll('.uisw button').forEach(b=>b.onclick=()=>setUI(b.dataset.ui,true));

/* ================= update notices ================= */
let notice=null; // {kind:'updated'|'available', v}
function renderNotice(){
  const box=$('#notice'); if(!notice){ box.hidden=true; $('#nback').hidden=true; return; }
  box.hidden=false; const modal=notice.kind==='updated'; box.classList.toggle('modal',modal); $('#nback').hidden=!modal;
  $('#notice-txt').textContent = notice.kind==='updated' ? t('updated',{v:notice.v}) : t('updAvail',{v:notice.v});
  const list=$('#notice-list'); list.innerHTML='';
  if(notice.kind==='updated'){ (t('news')||[]).forEach(x=>{ const li=document.createElement('li'); li.textContent=x; list.appendChild(li); }); }
  list.hidden=notice.kind!=='updated';
  $('#notice-btn').hidden=notice.kind!=='available'; $('#notice-ok').hidden=notice.kind!=='updated';
}
$('#notice-ok').onclick=()=>{ notice=null; renderNotice(); };
$('#nback').onclick=()=>{ notice=null; renderNotice(); };
$('#notice-btn').onclick=()=>{ location.reload(); };
(function(){ let seen=null; try{ seen=localStorage.getItem('tarjuman.seenVersion'); localStorage.setItem('tarjuman.seenVersion',APP_VERSION); }catch(e){}
  if(seen && seen!==APP_VERSION) notice={kind:'updated',v:APP_VERSION}; })();
async function checkUpdate(){
  if(IN_CLAUDE||!/^https?:$/.test(location.protocol)) return;
  try{ const r=await fetch('version.json?ts='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const j=await r.json();
    if(j&&j.version&&j.version!==APP_VERSION&&(!notice||notice.kind!=='available')){ notice={kind:'available',v:j.version}; renderNotice(); } }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
setInterval(checkUpdate,15*60*1000);

/* ================= text shared from WhatsApp ================= */
function pickUpSharedText(){
  const q=new URLSearchParams(location.search); const x=[q.get('title'),q.get('text')].filter(Boolean).join('\n').trim();
  if(q.has('shared')||q.has('text')||q.has('title')||q.has('v')) history.replaceState(null,'',location.pathname);
  if(!x) return; src.value=x; const d=detect(x); if(d) setDir(d,d===state.me?state.them:state.me); runText(true);
}
if(!IN_CLAUDE&&(location.protocol==='https:'||location.hostname==='localhost')&&'serviceWorker' in navigator){
  if(!document.querySelector('link[rel=manifest]')){ const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l); }
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{});
}

/* ================= start ================= */
applyI18n(); applyDir(); clearResult(); renderNotice(); pickUpSharedText(); checkUpdate();

</script>
