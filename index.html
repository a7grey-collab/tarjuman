<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16201D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tarjuman</title>
<style>
/* Layout: one narrow column; WhatsApp-like voice feed is the main screen. Language colors: RU ink-blue, AR palm-green, EN clay */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#16201D; --muted:#5D6A65; --line:#DAE0DA;
  --ru:#2C4890; --ru-soft:#E5EAF6; --ar:#0A7656; --ar-soft:#DDF0E8; --en:#9A4A1E; --en-soft:#F6E8DE;
  --on-accent:#FFFFFF; --danger:#B3261E; --warn-soft:#FFF4D6; --warn:#7A5600; --wave:#9AA7A1;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,"Geeza Pro",sans-serif;
  --f-mark:"Amiri", Georgia, serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E6ECE9; --muted:#93A19B; --line:#27322E;
  --ru:#93ABEE; --ru-soft:#1C2640; --ar:#52D0A4; --ar-soft:#123026; --en:#E9A27A; --en-soft:#3A2418;
  --on-accent:#0E1412; --danger:#F2867E; --warn-soft:#3A2F12; --warn:#F3D27A; --wave:#5C6A64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E6ECE9; --muted:#93A19B; --line:#27322E;
  --ru:#93ABEE; --ru-soft:#1C2640; --ar:#52D0A4; --ar-soft:#123026; --en:#E9A27A; --en-soft:#3A2418;
  --on-accent:#0E1412; --danger:#F2867E; --warn-soft:#3A2F12; --warn:#F3D27A; --wave:#5C6A64; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-ui); margin:0; padding-inline:16px; padding-block:12px 24px}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
section.wrap{width:100%}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{opacity:.5; cursor:default}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ru); outline-offset:2px}
select{font:inherit; padding:7px 8px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}

header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.mark{display:flex; align-items:baseline; gap:8px}
.mark b{font:700 26px/1 var(--f-mark)}
.mark span{font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.chip{font-size:12px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); background:var(--surface); white-space:nowrap}
.chip i{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ar); margin-right:6px; vertical-align:1px}

.tabs{display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px}
.tabs button{border:0; background:transparent; padding:9px 4px; border-radius:9px; font-weight:500; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}

details.set{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 12px}
details.set summary{cursor:pointer; padding:10px 0; font-size:14px; color:var(--muted); list-style:none; display:flex; justify-content:space-between; gap:8px}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:"▾"}
details.set[open] summary::after{content:"▴"}
.setgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; padding-bottom:12px; font-size:13px; color:var(--muted)}
.setgrid label{display:flex; flex-direction:column; gap:4px}
.setgrid label.row{flex-direction:row; align-items:center; gap:8px}

/* language pair */
.pair{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:end}
.pair label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); letter-spacing:.04em; min-width:0}
.pair select{font-weight:600; padding:10px; border-radius:11px}
.swap{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:18px}

/* voice pack banner */
.pack{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:12px; background:var(--warn-soft); color:var(--warn); font-size:13.5px}
.pack.ok{background:var(--ar-soft); color:var(--ar)}
.pack .txt{flex:1; min-width:200px}
.pack button{border:0; border-radius:9px; padding:7px 12px; background:var(--ink); color:var(--bg); font-weight:600; font-size:13px}
.bar{height:5px; border-radius:9px; background:rgba(127,127,127,.25); overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; width:0; background:currentColor; transition:width .2s}

/* feed */
.feed{display:flex; flex-direction:column; gap:12px; min-height:180px}
.card{border-radius:18px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; width:min(100%,520px); min-width:0}
.card.mine{align-self:flex-start; border-bottom-left-radius:5px}
.card.theirs{align-self:flex-end; border-bottom-right-radius:5px}
.card.l-ru{background:var(--ru-soft)} .card.l-ar{background:var(--ar-soft)} .card.l-en{background:var(--en-soft)}
.card .head{display:flex; justify-content:space-between; gap:8px; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums}
.card .src{font-size:14px; color:var(--muted); overflow-wrap:anywhere}
.card .dst{font-size:20px; line-height:1.55; overflow-wrap:anywhere}
.card textarea{width:100%; min-height:70px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px; font:15px/1.5 var(--f-ui)}
.card .st{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.card .st.err{color:var(--danger)}
.card .st.rec{color:var(--danger); font-weight:600}
.card.example{opacity:.85}
.acts{display:flex; gap:6px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 11px; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.btn svg{width:16px; height:16px}
.btn.main{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
.spoken{font-size:15px; color:var(--muted); line-height:1.9; padding:2px 4px}
.orig{display:flex; flex-direction:column; gap:4px}
.orig:empty{display:none}
.orig .lab{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.attach{display:flex; gap:8px; flex-wrap:wrap}
.attach .btn{flex:1; justify-content:center; padding:11px 12px; font-size:14px; font-weight:600; border-style:dashed}
.install{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:13.5px}
.install .txt{flex:1; min-width:200px}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:4px 8px}
.is-ar{font-family:var(--f-ar)!important; direction:rtl; text-align:right}
.dst.is-ar{font-size:22px; line-height:1.75}

/* WhatsApp-like voice note */
.vn{display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:99px; padding:6px 14px 6px 6px; min-width:0}
.vn .play{flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--ink); color:var(--bg); display:grid; place-items:center}
.vn .play svg{width:18px; height:18px}
.vn .wave{flex:1; min-width:0; height:30px; display:flex; align-items:center; gap:2px; cursor:pointer}
.vn .wave i{flex:1; min-width:2px; max-width:4px; border-radius:2px; background:var(--wave)}
.vn .wave i.on{background:var(--ink)}
.vn .dur{flex:none; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

.recbar{display:grid; grid-template-columns:1fr 1fr; gap:10px; position:sticky; bottom:0; padding-block:8px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--bg); z-index:2}
.rec{border:0; border-radius:18px; padding:14px 8px; font-weight:600; font-size:16px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--on-accent); box-shadow:0 6px 18px rgba(0,0,0,.12); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.rec svg{width:28px; height:28px}
.rec.l-ru{background:var(--ru)} .rec.l-ar{background:var(--ar)} .rec.l-en{background:var(--en)}
.rec .lbl.ar-t{font-family:var(--f-ar)}
.rec small{font-weight:400; font-size:12px; opacity:.92}
.rec.on{background:var(--danger); animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(179,38,30,.16)}}
@media (prefers-reduced-motion:reduce){.rec.on,.mic.on{animation:none}}
.hint{font-size:12.5px; color:var(--muted); text-align:center}
.typerow{display:flex; gap:8px}
.typerow input{flex:1; min-width:0; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:16px var(--f-ui)}
.typerow button{border:0; border-radius:12px; padding:0 16px; background:var(--ink); color:var(--bg); font-weight:600}

/* text tab */
.pane{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); display:flex; flex-direction:column; min-width:0}
.pane.out{border-color:transparent}
.pane.out.l-ru{background:var(--ru-soft)} .pane.out.l-ar{background:var(--ar-soft)} .pane.out.l-en{background:var(--en-soft)}
#src{width:100%; min-height:120px; resize:vertical; border:0; background:transparent; color:var(--ink); padding:14px; font:18px/1.5 var(--f-ui); border-radius:var(--r)}
#src.is-ar{font-size:21px; line-height:1.7}
.result{padding:14px; min-height:90px; font-size:19px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere}
.result.is-ar{font-size:22px; line-height:1.75}
.result.muted{color:var(--muted); font-size:15px}
.tools{display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); align-items:center; flex-wrap:wrap}
.pane.out .tools{border-top-color:rgba(127,127,127,.18)}
.tools .sp{flex:1}
.mic{border:0; background:var(--ink); color:var(--bg); border-radius:99px; padding:9px 16px; font-weight:600; display:inline-flex; align-items:center; gap:8px}
.mic svg{width:18px; height:18px}
.mic.on{background:var(--danger); color:var(--on-accent); animation:pulse 1.2s infinite}
.status{font-size:13px; color:var(--muted); min-height:20px}
#textvoice{padding:0 10px 10px; display:flex; flex-direction:column; gap:8px}

/* history */
.hist{display:flex; flex-direction:column; gap:8px}
.hi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; text-align:left; width:100%}
.hi .s{color:var(--muted); font-size:13px; overflow-wrap:anywhere}
.hi .d{font-size:17px; overflow-wrap:anywhere}
.hi .w{font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-variant-numeric:tabular-nums}

.note{font-size:12.5px; color:var(--muted); line-height:1.55}
footer{display:flex; justify-content:center; align-items:center; gap:6px; font-size:13px; color:var(--muted); padding-top:8px; flex-wrap:wrap}
footer a{color:var(--ru); text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-weight:500}
footer svg{width:15px; height:15px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:14px; max-width:calc(100% - 32px); text-align:center; z-index:10}

.hright{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.uisw{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px; gap:2px}
.uisw button{border:0; background:transparent; border-radius:99px; padding:5px 10px; font-size:13px; font-weight:600; color:var(--muted)}
.uisw button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.uisw button[data-ui="ar"]{font-family:var(--f-ar)}
#ardict{font:16px/1.6 var(--f-ar); padding:8px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:100%}
.spoken{font-size:15px; color:var(--muted); line-height:1.9; padding:2px 4px}
[dir="rtl"] body{font-family:var(--f-ar), var(--f-ui)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@700&display=swap">
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><b>Tarjuman</b><span>RU · AR · EN</span></div>
    <div class="hright">
      <div class="uisw" role="group" aria-label="App language">
        <button data-ui="ru" aria-pressed="false">Рус</button><button data-ui="en" aria-pressed="false">Eng</button><button data-ui="ar" aria-pressed="false">عربي</button>
      </div>
      <div class="chip" id="engine"><i></i></div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="voice" id="t-voice" data-i18n="tabVoice"></button>
    <button role="tab" aria-selected="false" data-tab="text" id="t-text" data-i18n="tabText"></button>
    <button role="tab" aria-selected="false" data-tab="hist" id="t-hist" data-i18n="tabHist"></button>
  </div>

  <details class="set">
    <summary data-i18n="settings"></summary>
    <div class="setgrid">
      <label><span data-i18n="sRuVoice"></span>
        <select id="ruvoice">
          <option value="dmitri" data-voice="Dmitri|male">Dmitri</option>
          <option value="denis" data-voice="Denis|male">Denis</option>
          <option value="ruslan" data-voice="Ruslan|male">Ruslan</option>
          <option value="irina" data-voice="Irina|female">Irina</option>
        </select>
      </label>
      <label><span data-i18n="sEnVoice"></span>
        <select id="envoice">
          <option value="ryan" data-voice="Ryan|male|usa">Ryan</option>
          <option value="lessac" data-voice="Lessac|female|usa">Lessac</option>
          <option value="alan" data-voice="Alan|male|uk">Alan</option>
        </select>
      </label>
      <label><span data-i18n="sSpeed"></span>
        <select id="speed"><option value="1" data-i18n="spN"></option><option value="1.15" data-i18n="spS"></option><option value="1.3" data-i18n="spSS"></option></select>
      </label>
      <label><span data-i18n="sDialect"></span>
        <select id="dialect"><option value="msa" data-i18n="dMsa"></option><option value="saudi" data-i18n="dSaudi"></option></select>
      </label>
      <label><span data-i18n="sFmt"></span>
        <select id="fmt"><option value="opus" data-i18n="fOpus"></option><option value="mp3" data-i18n="fMp3"></option></select>
      </label>
      <label><span data-i18n="sAsr"></span>
        <select id="asr"><option value="accurate" data-i18n="aAcc"></option><option value="fast" data-i18n="aFast"></option></select>
      </label>
      <label><span data-i18n="sAsrLang"></span>
        <select id="asrlang"><option value="pair" data-i18n="alPair"></option><option value="auto" data-i18n="alAuto"></option></select>
      </label>
      <label style="grid-column:1/-1"><span data-i18n="sDict"></span>
        <textarea id="ardict" rows="3" dir="rtl" placeholder="شكرا = شُكْرًا"></textarea>
      </label>
      <label class="row"><input type="checkbox" id="autoplay" checked> <span data-i18n="sAutoplay"></span></label>
      <label class="row"><input type="checkbox" id="autotext" checked> <span data-i18n="sAutotext"></span></label>
    </div>
  </details>

  <!-- VOICE -->
  <section id="p-voice" class="wrap" style="gap:12px">
    <div class="pair">
      <label><span data-i18n="me"></span>
        <select id="me"><option value="ru">Русский</option><option value="ar">العربية</option><option value="en">English</option></select>
      </label>
      <button class="swap" id="pairswap" data-i18n-aria="swapLangs">⇄</button>
      <label><span data-i18n="them"></span>
        <select id="them"><option value="ru">Русский</option><option value="ar">العربية</option><option value="en">English</option></select>
      </label>
    </div>

    <div class="pack" id="pack">
      <div class="txt"><span id="pack-txt" data-i18n="pkCheck"></span><div class="bar" id="pack-bar" hidden><i></i></div></div>
      <button id="pack-btn" data-i18n="pkBtn" hidden></button>
    </div>

    <div class="feed" id="feed">
      <div class="card mine l-ru example" id="ex1">
        <div class="head"><span></span></div>
        <div class="src" dir="auto"></div>
        <div class="dst" dir="auto"></div>
        <div class="acts"><button class="btn main" id="ex1-go"></button></div>
      </div>
      <div class="empty" id="feed-empty" data-i18n="feedEmpty"></div>
    </div>

    <div class="attach">
      <button class="btn" id="attach-btn" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg><span data-i18n="attach"></span></button>
      <input type="file" id="attach-in" accept="audio/*,.opus,.ogg,.oga,.m4a,.mp3,.aac,.amr,.wav,.webm,.3gp" multiple hidden>
    </div>
    <div class="install" id="install" hidden>
      <div class="txt" id="install-txt"></div>
      <button class="btn main" id="install-btn" data-i18n="installBtn" hidden></button>
    </div>

    <form class="typerow" id="typeform">
      <input id="typein" data-i18n-ph="typePh" autocomplete="off" dir="auto">
      <button type="submit" data-i18n-aria="createVoice">→</button>
    </form>

    <div class="recbar">
      <button class="rec" id="rec-a"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg><span class="lbl"></span><small></small></button>
      <button class="rec" id="rec-b"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg><span class="lbl"></span><small></small></button>
    </div>
    <div class="hint" data-i18n="hint"></div>
  </section>

  <!-- TEXT -->
  <section id="p-text" class="wrap" style="gap:12px" hidden>
    <div class="pair">
      <label><span data-i18n="from"></span>
        <select id="from"><option value="ru">Русский</option><option value="ar">العربية</option><option value="en">English</option></select>
      </label>
      <button class="swap" id="swap" data-i18n-aria="swapLangs">⇄</button>
      <label><span data-i18n="to"></span>
        <select id="to"><option value="ru">Русский</option><option value="ar">العربية</option><option value="en">English</option></select>
      </label>
    </div>
    <div class="pane">
      <textarea id="src" data-i18n-ph="srcPh" dir="auto"></textarea>
      <div class="tools">
        <button class="mic" id="mic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg><span data-i18n="speak"></span></button>
        <span class="sp"></span>
        <button class="btn" id="clear" data-i18n="clear"></button>
      </div>
    </div>
    <div class="pane out l-ar" id="outpane">
      <div class="result" id="dst" dir="auto"></div>
      <div class="tools">
        <button class="btn main" id="mkvoice" data-i18n="createVoice"></button>
        <button class="btn" id="copy" data-i18n="copy"></button>
      </div>
      <div id="textvoice" hidden></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </section>

  <!-- HISTORY -->
  <section id="p-hist" class="wrap" style="gap:10px" hidden>
    <div class="hist" id="hist"></div>
    <button class="btn" id="hist-clear" style="align-self:center" data-i18n="histClear"></button>
  </section>

function planFixed(text,from){

    const sent=sents[si]||'', delim=sents[si+1]||'';
    if(!sent.trim()){ out.push({sep:sent+delim}); continue; }
    const pieces=sent.split(/(\s*[,،;؛]\s*)/); const cl=[], sp=[];
    pieces.forEach((p,i)=> i%2 ? sp.push(p) : cl.push(p));

      let hit=null, j;
      for(j=cl.length-1;j>=i;j--){ const k=fixedKey(cl.slice(i,j+1).join(', '),from); if(k){ hit=k; break; } }
      if(i>0) out.push({sep:sp[i-1]});
      if(hit){ out.push({fixed:hit}); any=true; i=j+1; continue; }
      out.push({text:cl[i]}); i++;

    out.push({sep:delim});
  }
  if(!any) return null;

    const last=merged[merged.length-1];
    if(p.text!=null){ if(last&&last.text!=null) last.text+=p.text; else merged.push({text:p.text}); continue; }
    if(p.sep!=null){ if(last&&last.text!=null&&!/[.!?؟…\n]/.test(p.sep)) last.text+=p.sep; else merged.push({sep:p.sep}); continue; }
    merged.push(p);

}

  async function canOpus(){
    if(!window.AudioEncoder || !window.OfflineAudioContext) return false;
    try{ return (await AudioEncoder.isConfigSupported({codec:'opus',sampleRate:48000,numberOfChannels:1,bitrate:32000})).supported; }catch(e){ return false; }
  }
  async function opus(f,sr){
    const n48=Math.ceil(f.length*48000/sr);

    const src=ctx.createBufferSource(); src.buffer=ab; src.connect(ctx.destination); src.start();
    const pcm=(await ctx.startRendering()).getChannelData(0);
    const packets=[]; let head=null, err=null;
    const enc=new AudioEncoder({ output:(chunk,meta)=>{ const b=new Uint8Array(chunk.byteLength); chunk.copyTo(b); packets.push({b,dur:chunk.duration}); if(meta&&meta.decoderConfig&&meta.decoderConfig.description) head=new Uint8Array(meta.decoderConfig.description); }, error:e=>err=e });

  function peaks(f,n=40){ const out=[], step=Math.max(1,Math.floor(f.length/n)); let mx=0; for(let i=0;i<n;i++){ let s=0; for(let j=i*step;j<Math.min(f.length,(i+1)*step);j++) s+=f[j]*f[j]; const v=Math.sqrt(s/step); out.push(v); if(v>mx) mx=v; } return out.map(v=>mx?Math.max(.12,v/mx):.12); }

    text=clean(text,lang); if(!text) throw new Error(t('errNoText'));

    onStep&&onStep(t('stPrep'));

      let tk=null;

      text=arPrepare(text,tk,hasHarakat);

    const spokenText=text; if(lang==='ar') text=arSpeech(text);
    await phFiles(prog(t('stLoadPh')));
    const {s,cfg}=await session(voiceKey(lang),prog(t('stLoadVoice',{l:L[lang].short})));
    onStep&&onStep(t('stSynth'));
    const ids=await phonemize(text,(cfg.espeak&&cfg.espeak.voice)||lang);
    const O=await ort(); const inf=cfg.inference||{};

/* ================= files for sharing ================= */
function fileFor(v,ext){
  const name='Tarjuman_'+L[v.lang].short+'_'+stamp()+'.'+ext;
  const type=v.kind==='opus'?'audio/ogg':v.kind==='mp3'?'audio/mpeg':'audio/wav';
  return new File([v.blob],name,{type});
}
async function shareVoice(v){
  const exts = v.kind==='opus' ? ['opus','ogg'] : [v.kind];
  try{
    if(navigator.canShare){ for(const ext of exts){ const f=fileFor(v,ext); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } } }
  }catch(e){ if(e.name==='AbortError') return; }
  downloadVoice(v); toast(t('savedFile'));
}
function downloadVoice(v){
  const f=fileFor(v, v.kind==='opus'?'ogg':v.kind);
  const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
}

/* WhatsApp-style voice note player */
function voiceNote(v){
  const el=document.createElement('div'); el.className='vn'; el.dir='ltr';
  el.innerHTML='<button class="play">'+ICON.play+'</button><div class="wave"></div><span class="dur"></span>';
  const wave=el.querySelector('.wave'), dur=el.querySelector('.dur'), play=el.querySelector('.play');
  play.setAttribute('aria-label',t('listen'));
  v.peaks.forEach(p=>{ const i=document.createElement('i'); i.style.height=Math.round(p*100)+'%'; wave.appendChild(i); });
  const bars=[...wave.children]; dur.textContent=mmss(v.seconds);
  const au=new Audio(v.url); au.preload='auto';
  const paint=()=>{ const frac=au.duration?au.currentTime/au.duration:0; const k=Math.round(frac*bars.length); bars.forEach((b,i)=>b.classList.toggle('on',i<k)); dur.textContent=au.paused?mmss(v.seconds):mmss(au.currentTime); };
  au.ontimeupdate=paint;
  au.onplay=()=>{ stopAllSound(au); currentAudio=au; play.innerHTML=ICON.pause; };
  au.onpause=()=>{ play.innerHTML=ICON.play; paint(); };
  au.onended=()=>{ au.currentTime=0; paint(); };
  play.onclick=()=>{ if(au.paused) au.play().catch(()=>{}); else au.pause(); };
  wave.onclick=e=>{ const r=wave.getBoundingClientRect(); if(au.duration){ au.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*au.duration; paint(); } };
  el.audio=au;
  return el;
}

/* WhatsApp-style recording: hold to talk and release, or tap to start and tap to finish */
let rec=null;
function startRec(b){
  const from=b.dataset.from, to=b.dataset.to, mine=b.id==='rec-a';
  stopAllSound();
  const c=newCard(from,to,mine); const srcEl=c.querySelector('.src'), st=c.querySelector('.st');
  st.className='st rec'; const t0=Date.now(); let text='';
  const tick=setInterval(()=>{ setT(st,[['recording',{t:mmss((Date.now()-t0)/1000)}]]); },250);
  setT(st,[['recording',{t:'0:00'}]]);
  const session={btn:b, card:c};
  const lis=createListener(from,{
    interim:x=>{ text=x; srcEl.textContent=x; },
    end:(x)=>{
      clearInterval(tick);
      if(rec===session){ rec=null; applyPair(); }
      const final=(x||text).trim();
      if(!final){ c.remove(); return; }
      st.className='st'; setRaw(st,''); processCard(c,from,to,final);
    }
  });
  if(!lis){ clearInterval(tick); c.remove(); return; }
  session.lis=lis; rec=session; applyPair();
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
}

  });
  const up=()=>{ if(!startedHere) return; startedHere=false; if(Date.now()-downAt>450) stopRec(); };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(rec&&rec.btn===b) stopRec(); else { if(rec) stopRec(); startRec(b); } } });

    box.appendChild(voiceNote(v));
    if(lang==='ar' && v.spoken){ const sp=document.createElement('div'); sp.className='spoken is-ar'; sp.dir='rtl'; sp.textContent=v.spoken; box.appendChild(sp); }

  }catch(e){ if(gen===textGen) setT(st,[['vErr',{e:e.message||'error'}]]); }
}

const TF_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js';
const ASR_MODELS={ accurate:{id:'onnx-community/whisper-small', mb:250}, fast:{id:'onnx-community/whisper-base', mb:80} };
const ASR = (()=>{
  const SRC = `
let asr=null, cur=null;
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (!asr || cur !== m.model) {
      const T = await import('${TF_URL}');
      T.env.allowLocalModels = false;
      const files = {};
      asr = await T.pipeline('automatic-speech-recognition', m.model, {
        dtype: { encoder_model: 'q8', decoder_model_merged: 'q8' }, device: 'wasm',
        progress_callback: (x) => {
          if (x.status === 'progress' && x.total) {
            files[x.file] = [x.loaded || 0, x.total];
            let a = 0, b = 0; for (const k in files) { a += files[k][0]; b += files[k][1]; }
            self.postMessage({ type: 'progress', id: m.id, frac: b ? a / b : 0 });
          }
        }
      });
      cur = m.model;
    }
    if (m.type === 'load') { self.postMessage({ type: 'done', id: m.id }); return; }
    self.postMessage({ type: 'working', id: m.id });
    const out = await asr(m.pcm, { language: m.lang || null, task: 'transcribe', chunk_length_s: 30, stride_length_s: 5 });
    self.postMessage({ type: 'done', id: m.id, text: (out && out.text ? out.text : '').trim() });
  } catch (err) {
    self.postMessage({ type: 'error', id: m.id, message: String((err && err.message) || err) });
  }
};`;
  let worker=null, seq=0; const jobs=new Map();
  function getWorker(){
    if(worker) return worker;
    const url=URL.createObjectURL(new Blob([SRC],{type:'text/javascript'}));
    worker=new Worker(url,{type:'module'});
    worker.onmessage=e=>{ const m=e.data, j=jobs.get(m.id); if(!j) return;
      if(m.type==='progress') j.onProg&&j.onProg('load',m.frac);
      else if(m.type==='working') j.onProg&&j.onProg('work');
      else if(m.type==='done'){ jobs.delete(m.id); j.res(m.text||''); }
      else if(m.type==='error'){ jobs.delete(m.id); j.rej(new Error(m.message)); }
    };
    worker.onerror=e=>{ const err=new Error(t('errAsrStart')+(e&&e.message?': '+e.message:'')); jobs.forEach(j=>j.rej(err)); jobs.clear(); try{worker.terminate();}catch(_){} worker=null; };
    return worker;
  }
  function call(msg,onProg,transfer){ return new Promise((res,rej)=>{ const id=++seq; jobs.set(id,{res,rej,onProg}); getWorker().postMessage(Object.assign({id},msg),transfer||[]); }); }
  // jobs run one after another
  let chain=Promise.resolve();
  function queue(fn){ const p=chain.then(fn,fn); chain=p.catch(()=>{}); return p; }
  return {
    model:()=>ASR_MODELS[state.asr]||ASR_MODELS.accurate,
    load(onProg){ return queue(()=>call({type:'load',model:this.model().id},onProg)); },
    transcribe(pcm,lang,onProg){ return queue(()=>call({type:'run',model:this.model().id,pcm,lang},onProg,[pcm.buffer])); },
    async isReady(){ try{ if(!window.caches) return false; const c=await caches.open('transformers-cache'); const base='https://huggingface.co/'+this.model().id+'/resolve/main/onnx/'; return !!(await c.match(base+'encoder_model_quantized.onnx')) && !!(await c.match(base+'decoder_model_merged_quantized.onnx')); }catch(e){ return false; } }
  };
})();

async function decodeAudio(blob){
  const buf=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw new Error(t('errNoAudio'));
  const ac=new AC(); let ab;
  try{ ab=await new Promise((res,rej)=>{ const p=ac.decodeAudioData(buf.slice(0),res,rej); if(p&&p.then) p.then(res,rej); }); }
  catch(e){ throw new Error(t('errOpenAudio')+(/iPhone|iPad|Mac/.test(navigator.userAgent)?' '+t('errSafariOpus'):'')); }
  finally{ try{ ac.close(); }catch(e){} }
  const n=Math.max(1,Math.ceil(ab.duration*16000)); const off=new OfflineAudioContext(1,n,16000);
  const s=off.createBufferSource(); s.buffer=ab; s.connect(off.destination); s.start();
  const r=await off.startRendering(); return {pcm:r.getChannelData(0), seconds:ab.duration};
}
function wavePeaks(f,n=40){ const out=[], step=Math.max(1,Math.floor(f.length/n)); let mx=0; for(let i=0;i<n;i++){ let s=0; for(let j=i*step;j<Math.min(f.length,(i+1)*step);j++) s+=f[j]*f[j]; const v=Math.sqrt(s/step); out.push(v); if(v>mx) mx=v; } return out.map(v=>mx?Math.max(.12,v/mx):.12); }



let incomingChain=Promise.resolve();
function handleIncoming(blob,name){ incomingChain=incomingChain.then(()=>processIncoming(blob,name)).catch(()=>{}); }
async function processIncoming(blob,name){
  if(IN_CLAUDE){ toast(t('asrClaude')); return; }
  $('#t-voice').click();
  const hint = state.asrlang==='auto' ? null : state.them;
  let from = hint || state.them, to = from===state.me ? state.them : state.me;
  const c=newCard(from,to,false); c.classList.add('incoming');
  const orig=c.querySelector('.orig'), st=c.querySelector('.st'), srcEl=c.querySelector('.src');
  setT(c.querySelector('.head span'),[['incoming']]);
  st.className='st'; setT(st,[['opening']]);
  let audio;
  try{ audio=await decodeAudio(blob); }
  catch(e){ st.className='st err'; setRaw(st,e.message); return; }
  const url=URL.createObjectURL(blob);
  const lab=document.createElement('span'); lab.className='lab'; setT(lab,[['original'],['=',' · '+mmss(audio.seconds)]]); orig.appendChild(lab);
  const pcmCopy=audio.pcm.slice(0);
  orig.appendChild(voiceNote({url,seconds:audio.seconds,peaks:wavePeaks(audio.pcm),lang:from}));
  if(audio.seconds<0.3){ st.className='st err'; setT(st,[['asrShort']]); return; }
  const ready=await ASR.isReady(); const t0=Date.now(); let tick=null; const m=ASR.model();
  setT(st, ready ? [['transcribing']] : [['asrLoad',{mb:m.mb}]]);
  let text='';
  try{
    text=await ASR.transcribe(pcmCopy, hint, (phase,frac)=>{
      if(phase==='load') setT(st,[['asrLoadPct',{pct:Math.round((frac||0)*100),mb:m.mb}]]);
      else if(phase==='work'){ clearInterval(tick); const est=Math.max(5,Math.round(audio.seconds*(state.asr==='fast'?0.4:1.1))); tick=setInterval(()=>{ setT(st,[['asrWork',{t:mmss((Date.now()-t0)/1000),est:mmss(est+5)}]]); },500); }
    });
  }catch(e){ clearInterval(tick); st.className='st err'; const net=/locate file|fetch|network|Failed to load|404|403/i.test(e.message||''); setT(st, net ? [['asrNet']] : [['asrErr',{e:e.message||'error'}]]); return; }
  clearInterval(tick);
  text=text.replace(/\[(?:music|музыка|silence|BLANK_AUDIO)[^\]]*\]/gi,'').trim();
  if(!text){ st.className='st err'; setT(st,[['asrNone']]); return; }
  const d=detect(text);
  if(d && d!==from){ from=d; to = from===state.me ? state.them : state.me; c.className='card theirs incoming l-'+from; }
  srcEl.classList.toggle('is-ar',from==='ar'); c.querySelector('.dst').classList.toggle('is-ar',to==='ar');
  setT(c.querySelector('.head span'),[['incoming'],['=',' · '+L[from].short+' → '+L[to].short]]);
  processCard(c,from,to,text);
}

['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{

}));

/* ================= app install + share target (WhatsApp → Share → Tarjuman) ================= */
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
let installEvt=null, installState='';
function renderInstall(){
  if(installState==='done'){ $('#install').hidden=false; $('#install-txt').textContent=t('installed'); $('#install-btn').hidden=true; return; }
  if(installState==='prompt'){ $('#install').hidden=false; $('#install-txt').textContent=t('installTxt'); $('#install-btn').hidden=false; return; }
  if(installState==='android'){ $('#install').hidden=false; $('#install-txt').textContent=t('installAndroid'); $('#install-btn').hidden=true; return; }
  $('#install').hidden=true;
}
async function pickUpShared(){
  if(!window.caches) return;
  try{
    const c=await caches.open('tarjuman-share'); const keys=await c.keys();
    for(const k of keys){ if(!/\/shared\//.test(k.url)) continue; const r=await c.match(k); await c.delete(k); if(!r) continue; const b=await r.blob(); handleIncoming(b, decodeURIComponent(r.headers.get('x-name')||'voice')); }
  }catch(e){}
  if(location.search.includes('shared=')) history.replaceState(null,'',location.pathname);
}
if(!IN_CLAUDE && (location.protocol==='https:'||location.hostname==='localhost') && 'serviceWorker' in navigator){
  if(!document.querySelector('link[rel=manifest]')){ const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l); }
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  pickUpShared();
  if(!STANDALONE && IS_ANDROID) installState='android';
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(!STANDALONE){ installState='prompt'; renderInstall(); } });
  $('#install-btn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); const r=await installEvt.userChoice.catch(()=>null); installEvt=null; installState = r&&r.outcome==='accepted' ? 'done' : 'android'; renderInstall(); };
  window.addEventListener('appinstalled',()=>{ installState='done'; renderInstall(); });
}
